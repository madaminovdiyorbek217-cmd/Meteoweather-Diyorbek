<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Погода Узбекистана</title>
<meta name="description" content="Погода по всем регионам Узбекистана: прогноз на 15 дней, почасовой график, качество воздуха и живой фон">
<meta name="theme-color" content="#0c1a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="shade"></div>

<div class="app">
  <header>
    <div class="hl">
      <div class="brand">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="4.5"/><path d="M10 1.5v2M1.5 10h2M3.9 3.9l1.4 1.4M16.1 3.9l-1.4 1.4"/><path d="M8 24a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 19 14.3 4.8 4.8 0 0 1 18.5 24z"/></svg>
        <span data-i="brand">Погода Узбекистана</span>
      </div>
      <div class="clock" id="clock"></div>
    </div>
    <a class="maker" href="https://t.me/madaminovv712" target="_blank" rel="noopener" data-t="makerTitle">
      <span data-i="maker">Создатель сайта</span>
      <b><span data-i="makerName">Диёрбек Мадаминов</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 3.5 2.5 10.8l6.2 2.4 2.4 6.3zM8.7 13.2l12.8-9.7"/></svg>
      </b>
    </a>
  </header>

  <div class="toolbar">
    <div class="tl">
      <div class="select" id="select">
        <button type="button" class="selbtn" id="selbtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="menu">
          <span class="sl" data-i="region">Регион</span>
          <span class="si" id="selIcon"></span>
          <span class="sn" id="selName">Ташкент</span>
          <span class="sd" id="selDeg">–</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="menu" role="listbox" hidden></div>
      </div>
      <button type="button" class="ibtn" id="favbtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      </button>
      <button type="button" class="ibtn" id="locbtn" data-t="locate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div class="tr">
      <div class="seg" id="langseg" role="group" aria-label="Language / Til">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="uz" aria-pressed="false">UZ</button>
      </div>
      <div class="setwrap">
        <button type="button" class="ibtn" id="setbtn" aria-haspopup="true" aria-expanded="false" aria-controls="setpop" data-t="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        </button>
        <div class="setpop" id="setpop" hidden></div>
      </div>
    </div>
  </div>

  <div class="favs" id="favs" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="sec" id="s-alerts"></div>

  <main class="stage" id="stage">
    <div class="col">
      <div class="sec o1" id="s-hero"></div>
      <div class="sec o2" id="s-hourly"></div>
      <div class="sec o4" id="s-air"></div>
      <div class="sec o5" id="s-tips"></div>
    </div>
    <div class="col">
      <div class="sec o3" id="s-week"></div>
      <div class="sec o6" id="s-map"></div>
    </div>
  </main>

  <footer>
    <div><span data-i="footData">Данные</span>: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · <span data-i="footEvery">обновляются каждые 15 минут</span> · <span id="updated"></span></div>
    <div class="fx" id="fx"></div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/sky.js"></script>
<script src="js/uzmap.js"></script>
<script src="js/data.js"></script>
<script src="js/insights.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
